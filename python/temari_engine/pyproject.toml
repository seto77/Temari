[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "temari-engine"
version = "0.3.0"
description = "Run the Temari engine from Python, read its outputs and published sets with membership and artifact_role checks, and turn dataset F into per-line X-ray responses"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.optional-dependencies]
xray = ["xraylib>=4.2.1"]   # temari_engine.xray_lines only (4.3.0 if tests run under python -W error)

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
temari_engine = ["known_sets.json"]
