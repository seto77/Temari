# Minimal CI: the verification ladder that the repository already ships.
# Nothing here needs a package registry - Temari depends on the Julia standard
# library only, so every job is "check out, install Julia, run a script".
name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    # Analytic ladder T0-T24 and T26-T27, plus lettered sub-tests (T25 is
    # unassigned; 260818Cl -- this said "T0-T8", the ladder as it stood then):
    # hydrogen bound and continuum states, point-nucleus Dirac eigenvalues,
    # 3j closed forms, the c -> infinity limit, the virial identity, KLI
    # exchange, Mott elastic scattering and the Bethe-ridge impulse limit.
    # Failures are @assert, so a non-zero exit is a real failure.
    name: selftest (${{ matrix.os }}, Julia ${{ matrix.julia }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia: ["1.11.9", "1.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      # The pin is per dataset generation (see the reproducibility policy):
      # 1.11.9 for the F(s, E0) datasets (v3/v4/v5), 1.12.6 for dataset-factors
      # v1.0.0 -- 260818Cl: so the 1.12 leg is a shipping interpreter too, not
      # only an early warning for drift.
      - name: selftest
        run: julia --startup-file=no -t auto src/ionization.jl selftest

  bit-identity:
    # The optimized kernels must produce exactly the same bits as the scalar
    # reference implementations. Every script in this job exits non-zero on a
    # mismatch (260818Cl: five steps now, and the integrity one guards the
    # cache and the production checkpoint rather than a kernel).
    name: bit-identity of the optimized kernels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - name: SIMD spherical Bessel vs scalar (288 cases)
        run: julia --startup-file=no -t 1 tools/verify_simd_bessel.jl

      - name: Radial-integral q lane vs reference (75 cases)
        run: julia --startup-file=no -t 1 tools/verify_e5_qlane.jl

      # The v4 shipping path: the q-lane SIMD accumulation and the exact-zero
      # prefix skip in the Dirac radial table, against the pre-port reference.
      - name: Dirac radial-integral q lane vs reference (75 cases)
        run: julia --startup-file=no -t 1 tools/verify_e5_qlane_dirac.jl

      - name: Cache and production-checkpoint integrity
        run: julia --startup-file=no -t 1 tools/verify_integrity.jl

      # The v4 angular fast path: the Q+ hoist, the packed channel arrays and the
      # interleaved Legendre recurrence, all against the preserved oracle.
      - name: Angular fast path vs oracle (61440 elements)
        run: julia --startup-file=no -t 1 tools/verify_angular_pack.jl

  refcheck:
    # Cross-implementation check: the Julia engine against values produced by the
    # independent Python implementation (src/reference_values.json).
    # refcheck() itself only reports, so the gate is applied here.
    name: refcheck vs the independent Python implementation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - name: "refcheck (gate: worst deviation < 1e-5)"
        run: |
          julia --startup-file=no -t auto -e '
            include("src/ionization.jl")
            worst = refcheck()
            if !(worst < 1e-5)
                @error "refcheck gate failed" worst
                exit(1)
            end
            println("refcheck gate OK: worst = ", worst)'

  small-component:
    # The only external figures that exist for the small-component fraction are
    # three one-significant-digit values in Zhang et al. 2024 section 6.2. The
    # gate is whether our zeta lands inside the interval that rounds to each of
    # them -- the most a one-digit reference can assert. It needs no reference
    # data on disk: the three quoted figures are constants in the script and the
    # orbitals are solved here, so this runs in a clean checkout.
    # It bounds zeta to roughly 17% (Si) and 25% (Au) and nothing finer; the
    # exact internal check is the virial identity in selftest T6/T6b.
    name: small-component fraction vs the external figures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - name: "zeta (gate: inside the one-digit rounding interval, 6/6)"
        run: julia --startup-file=no -t auto tools/small_component_check.jl
