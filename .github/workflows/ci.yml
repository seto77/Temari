# Minimal CI: the verification ladder that the repository already ships.
# Nothing here needs a package registry - Temari depends on the Julia standard
# library only, so every job is "check out, install Julia, run a script".
name: CI

on:
  push:
    paths-ignore:
      - "docs/**"
      - "**/*.md"
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  selftest:
    # Analytic ladder T0-T24 and T26-T27, plus lettered sub-tests (T25 is
    # unassigned; 260818Cl -- this said "T0-T8", the ladder as it stood then):
    # hydrogen bound and continuum states, point-nucleus Dirac eigenvalues,
    # 3j closed forms, the c -> infinity limit, the virial identity, KLI
    # exchange, Mott elastic scattering and the Bethe-ridge impulse limit.
    # Failures are @assert, so a non-zero exit is a real failure.
    name: selftest (${{ matrix.os }}, Julia ${{ matrix.julia }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        julia: ["1.11.9", "1.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: ${{ matrix.julia }}

      # The pin is per dataset generation (see the reproducibility policy):
      # 1.11.9 for the F(s, E0) datasets (v3/v4/v5), 1.12.6 for dataset-factors
      # v1.0.0 -- 260818Cl: so the 1.12 leg is a shipping interpreter too, not
      # only an early warning for drift.
      # 260922Cl: the exit code alone is not enough -- a selftest that never
      # starts (the CLI branch not reached) also exits 0. Require the final
      # "ALL PASS (" line, as the jobq acceptance does. bash on both OSes so
      # that pipefail carries Julia's exit code through tee.
      - name: selftest
        shell: bash
        run: |
          julia --startup-file=no -t auto src/ionization.jl selftest 2>&1 | tee selftest.log
          bash tools/require_all_pass.sh selftest.log

  bit-identity:
    # The optimized kernels against their reference implementations. Every
    # script in this job exits non-zero on a failure (260818Cl: five steps
    # now, and the integrity one guards the cache and the production
    # checkpoint rather than a kernel).
    # 260922Cl: the author released the bit-identity discipline on 2026-08-28
    # and d19eb9c reordered the Bessel and R arithmetic, after which the first
    # two steps failed on every run. They now follow the author's rule
    # (docs/notes/ci_bitident_gate_2026-09-22.md): the q-lane step gates R on
    # the reassociation bound (n-1)*eps*sum|terms|, and over it on a 256-bit
    # BigFloat judgement (new error <= 2 x reference error + bound); the Bessel
    # step reports SIMD and scalar accuracy against BigFloat and fails only on
    # NaN/Inf. The other three steps still require identical bits.
    name: bit-identity of the optimized kernels
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - name: SIMD spherical Bessel accuracy vs BigFloat, reported (288 cases)
        run: julia --startup-file=no -t 1 tools/verify_simd_bessel.jl

      - name: Radial-integral q lane vs reference, n-eps gate + BigFloat (75 cases)
        run: julia --startup-file=no -t 1 tools/verify_e5_qlane.jl

      # The v4 shipping path: the q-lane SIMD accumulation and the exact-zero
      # prefix skip in the Dirac radial table, against the pre-port reference.
      - name: Dirac radial-integral q lane vs reference (75 cases)
        run: julia --startup-file=no -t 1 tools/verify_e5_qlane_dirac.jl

      - name: Cache and production-checkpoint integrity
        run: julia --startup-file=no -t 1 tools/verify_integrity.jl

      # The v4 angular fast path: the Q+ hoist, the packed channel arrays and the
      # interleaved Legendre recurrence, all against the preserved oracle.
      - name: Angular fast path vs oracle (61440 elements)
        run: julia --startup-file=no -t 1 tools/verify_angular_pack.jl

  engine-api:
    # 260922Cl (L-C E1-E2, author decision I65): the --json envelope, the set
    # manifest writer, the engine source list, and the Python reader
    # (python/temari_engine). The dataset F / dataset-factors archive tests and
    # the Julia-launching run() tests skip by name here (no dist/ in CI).
    name: engine API (envelope, set manifests, temari_engine)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: envelope unit test
        run: julia --startup-file=no --project=. tools/cli_envelope_test.jl

      - name: set manifest writer
        run: julia --startup-file=no --project=. tools/artifact_manifest_test.jl

      - name: engine and factors source lists
        run: julia --startup-file=no --project=. tools/factors_source_files_test.jl

      - name: temari_engine (Python)
        env:
          PYTHONPATH: python/temari_engine/src
        run: python -W error -m unittest discover -s python/temari_engine/tests -v

  golden-report:
    # 260922Cl (L-C E3, author decision I70): the first run on GitHub (c1b574c)
    # failed all six golden cases against a tolerance taken from one machine's
    # spread, which was zero. Physics values moved by 1e-10..1e-8 of their
    # scale and near-zero diagnostics (closures, residuals) by much more. Until
    # the cross-platform spread is measured and a new tolerance is registered,
    # this job only reports (always exit 0) and keeps the re-run outputs as an
    # artifact on Linux and Windows.
    name: golden v1 re-run (report only, ${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: re-run golden v1 and keep the outputs
        shell: bash
        env:
          PYTHONPATH: python/temari_engine/src
          PYTHONIOENCODING: utf-8
        run: |
          rc=0
          mkdir -p golden_out
          python -m temari_engine golden verification/golden_v1 --julia julia --save-dir golden_out > golden_report.txt 2>&1 || rc=$?
          cat golden_report.txt
          echo "golden exit code: $rc (report only, author decision I70)"
          echo "$rc" > golden_out/exit_code.txt
          cp golden_report.txt golden_out/

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: golden-out-${{ matrix.os }}
          path: golden_out/

  refcheck:
    # Cross-implementation check: the Julia engine against values produced by the
    # independent Python implementation (src/reference_values.json).
    # refcheck() itself only reports, so the gate is applied here.
    name: refcheck vs the independent Python implementation
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - name: "refcheck (gate: worst deviation < 1e-5)"
        run: |
          julia --startup-file=no -t auto -e '
            include("src/ionization.jl")
            worst = refcheck()
            if !(worst < 1e-5)
                @error "refcheck gate failed" worst
                exit(1)
            end
            println("refcheck gate OK: worst = ", worst)'

  small-component:
    # The only external figures that exist for the small-component fraction are
    # three one-significant-digit values in Zhang et al. (2025) §6.2. The
    # gate is whether our zeta lands inside the interval that rounds to each of
    # them -- the most a one-digit reference can assert. It needs no reference
    # data on disk: the three quoted figures are constants in the script and the
    # orbitals are solved here, so this runs in a clean checkout.
    # It bounds zeta to roughly 17% (Si) and 25% (Au) and nothing finer; the
    # exact internal check is the virial identity in selftest T6/T6b.
    name: small-component fraction vs the external figures
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11.9"

      - name: "zeta (gate: inside the one-digit rounding interval, 6/6)"
        run: julia --startup-file=no -t auto tools/small_component_check.jl
