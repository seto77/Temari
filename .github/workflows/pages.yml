# Build the MkDocs Material documentation and deploy it to GitHub Pages.
# Mirrors the ReciPro setup: sources in docs/src, configuration in docs/mkdocs.yml,
# output in docs/site (git-ignored), built from the repository root.
name: Deploy documentation to GitHub Pages

on:
  push:
    branches:
      - main
    paths:
      - docs/**
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      # --strict turns broken internal links into build failures.
      - name: Build documentation
        run: mkdocs build -f docs/mkdocs.yml --strict

      - name: Configure Pages
        # enablement: true lets the workflow turn Pages on by itself; without it the
        # very first run fails with "Get Pages site failed / Not Found" when Pages has
        # not been enabled in the repository settings.
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
